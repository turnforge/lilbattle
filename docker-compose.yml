networks:
  lilbattlenetwork:
    external: true

services:
  lilbattle:
    networks:
      - lilbattlenetwork
    build:
      context: .
      dockerfile: ./cmd/backend/Dockerfile
    volumes:
      # Source mounted for iterate-without-rebuild dev flow.
      - ./cmd:/app/cmd
      - ./web:/app/web
      - ./protos:/app/protos
      - ./services:/app/services
      - ./utils:/app/utils
      - ./lib:/app/lib
      - ./gen:/app/gen
      - ./main.go:/app/main.go
      # main.go loads configs/.env.dev (dev) or configs/.env (prod).
      # Bind the whole configs/ dir so both are available in-container
      # AND docker doesn't auto-create empty dirs for missing individual
      # files (which fails the container-init step with "not a directory:
      # trying to mount a directory onto a file").
      - ./configs:/app/configs
      # Persist local-FS games/worlds across container restarts.
      - ~/dev-app-data/lilbattle:/root/dev-app-data/lilbattle
        # command: ["air", "-c", "cmd/backend/.air.toml"]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LILBATTLE_DB_ENDPOINT: ${LILBATTLE_DB_ENDPOINT}
      OTEL_RESOURCE_ATTRIBUTES: service.name=onehub.backend,service.version=0.0.1
      LILBATTLE_ENV: dev 
    ports:
      - 6060:6060
      - 7070:7070
      - 8080:8080
      - 9090:9090
